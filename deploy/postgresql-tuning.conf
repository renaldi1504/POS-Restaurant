# Tuning kecil PostgreSQL 16 untuk VPS 1 GB RAM (+ swap 2 GB).
# Salin ke /etc/postgresql/16/main/conf.d/pos-tuning.conf lalu: sudo systemctl restart postgresql
max_connections = 30
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 4MB
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 100
timezone = 'Asia/Phnom_Penh'
log_timezone = 'Asia/Phnom_Penh'
# Log query lambat (> 500 ms) untuk diagnosa
log_min_duration_statement = 500
