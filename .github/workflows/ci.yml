name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pos:pos@localhost:5432/pos_test
      DATABASE_URL: postgres://pos:pos@localhost:5432/pos_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: E2E (Chrome sistem)
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://pos:pos@localhost:5432/pos_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: build
          path: |
            apps/server/dist
            apps/server/drizzle
            apps/server/package.json
            apps/pos-web/dist
            apps/order-web/dist
          retention-days: 7

  deploy:
    # Aktif bila secret DEPLOY_HOST diisi (Settings → Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY).
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Cek secret
        id: check
        run: echo "enabled=${{ secrets.DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          name: build
          path: build
      - name: Rsync ke server & reload PM2
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && echo "$SSH_KEY" > ~/.ssh_key
          SSH="ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new"
          rsync -az --delete -e "$SSH" build/apps/server/dist/ "$USER@$HOST:/srv/pos/app/apps/server/dist/"
          rsync -az --delete -e "$SSH" build/apps/server/drizzle/ "$USER@$HOST:/srv/pos/app/apps/server/drizzle/"
          rsync -az --delete -e "$SSH" build/apps/pos-web/dist/ "$USER@$HOST:/srv/pos/www/pos/"
          rsync -az --delete -e "$SSH" build/apps/order-web/dist/ "$USER@$HOST:/srv/pos/www/order/"
          rsync -az -e "$SSH" deploy/ "$USER@$HOST:/srv/pos/app/deploy/"
          $SSH "$USER@$HOST" 'cd /srv/pos/app && git pull --ff-only && pnpm install --prod --frozen-lockfile --filter @pos/server... && node --env-file=.env apps/server/dist/migrate.js && pm2 reload deploy/ecosystem.config.cjs --update-env'
