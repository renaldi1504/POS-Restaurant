<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir – detail pesanan (HP)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:#047857}a:hover{color:#065F46}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #101828; display: flex; flex-direction: column; font-size: 16px; overflow: hidden">

  <header style="flex-shrink: 0; height: 64px; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <a href="Main.dc.html" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #D0D5DD; color: #101828; font-size: 16px; font-weight: 700; display: flex; align-items: center; text-decoration: none">‹ Menu</a>
    <b style="font-size: 20px">Order #12</b>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">
      <b style="font-size: 15px">Tipe order</b>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Makan sini</button>
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Bungkus</button>
        <button style="height: 48px; border-radius: 12px; border: none; background: #047857; color: #FFFFFF; font-size: 15px; font-weight: 800">Delivery</button>
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Grab</button>
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">foodpanda</button>
        <button style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Telegram</button>
      </div>
      <div style="margin-top: 4px; background: #EFF8FF; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #1849A9; line-height: 1.4"><b>Driver tidak perlu dipilih.</b> Setelah dapur menekan Siap, order ini muncul di aplikasi driver dan driver yang kosong mengambilnya.</div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 4px 12px; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #F2F4F7">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <b style="font-size: 16px; line-height: 1.3">{{p.nama}}</b>
            <span style="font-size: 14px; color: #667085">{{p.sub}}</span>
            <span style="font-size: 13px; color: #B42318; font-weight: 700">{{p.catatan}}</span>
          </div>
          <button aria-label="Kurangi" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 22px; font-weight: 700; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">−</button>
          <b style="width: 22px; text-align: center; font-size: 19px">{{p.qty}}</b>
          <button aria-label="Tambah" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 22px; font-weight: 700; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">+</button>
        </div>
      </sc-for>
      <button style="width: 100%; height: 48px; border: none; background: transparent; color: #047857; font-size: 15px; font-weight: 700; text-align: left">+ Catatan / diskon / promo Grab</button>
    </section>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #EAECF0; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #667085"><span>Ongkir (manual)</span><button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">0 ៛ · Ubah</button></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; font-weight: 600">Total</span><b style="font-size: 30px">42.000 ៛</b></div>
    <div style="display: flex; justify-content: flex-end; gap: 12px; font-size: 13px; color: #667085; margin-top: -6px"><span>≈ $10.25</span><span>≈ Rp 168.000</span></div>
    <div style="display: flex; gap: 10px">
      <button style="width: 96px; height: 60px; border-radius: 14px; border: 2px solid #F04438; background: #FFFFFF; color: #B42318; font-size: 17px; font-weight: 700; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Batal</button>
      <a href="Bayar.dc.html" style="flex-grow: 1; height: 60px; border-radius: 14px; background: #047857; color: #FFFFFF; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Bayar</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { nama: 'Ayam Goreng', sub: '2 × 10.000 = 20.000 ៛', catatan: 'Paha atas · Tidak pedas · + Nasi putih', qty: 2 },
        { nama: 'Pempek Kapal Selam', sub: '1 × 14.000 = 14.000 ៛', catatan: 'Tambah cuko', qty: 1 },
        { nama: 'Es Teh Manis', sub: '2 × 4.000 = 8.000 ៛', catatan: '', qty: 2 }
      ]
    };
  }
}
</script>
</body>
</html>
