<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir – detail pesanan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=add,arrow_back,check,edit,edit_note,payments,remove,two_wheeler&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; font-size: 17px; line-height: 24px; overflow: hidden">

  <header style="flex-shrink: 0; height: 64px; background: #F8FAF6; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px">
    <a href="Main.dc.html" aria-label="Kembali ke Menu" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #191C1A; text-decoration: none; flex-shrink: 0"><span class="ms" aria-hidden="true">arrow_back</span></a>
    <h1 class="num" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500">Order #12</h1>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <section style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 500">Tipe order</h2>
      <div role="radiogroup" aria-label="Tipe order" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button role="radio" style="height: 48px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 15px; font-weight: 500; padding: 0 4px">Makan sini</button>
        <button role="radio" style="height: 48px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 15px; font-weight: 500; padding: 0 4px">Bungkus</button>
        <button role="radio" aria-checked="true" style="height: 48px; border-radius: 8px; border: none; background: #CFE9DA; color: #092017; font-size: 15px; font-weight: 500; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span>Delivery</button>
        <button role="radio" style="height: 48px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 15px; font-weight: 500; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #00B14F"></span>Grab</button>
        <button role="radio" style="height: 48px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 15px; font-weight: 500; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #D70F64"></span>foodpanda</button>
        <button role="radio" style="height: 48px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 15px; font-weight: 500; padding: 0 4px">Telegram</button>
      </div>
      <div style="display: flex; gap: 12px; background: #C1E8FC; border-radius: 12px; padding: 12px; font-size: 16px; line-height: 22px; color: #001F2A"><span class="ms" aria-hidden="true" style="color: #3E6374">two_wheeler</span><span><b style="font-weight: 500">Driver tidak perlu dipilih.</b> Setelah dapur menekan Siap, order ini muncul di aplikasi driver dan driver yang kosong mengambilnya.</span></div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; padding: 0 16px">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #BFC9C2">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 18px; line-height: 24px; font-weight: 500">{{p.nama}}</span>
            <span class="num" style="font-size: 16px; line-height: 22px; color: #404944">{{p.sub}}</span>
            <span style="font-size: 16px; line-height: 22px; color: #BA1A1A; font-weight: 500">{{p.catatan}}</span>
          </div>
          <button aria-label="Kurangi" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #707973; background: transparent; color: #191C1A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">remove</span></button>
          <span class="num" style="width: 24px; text-align: center; font-size: 20px; font-weight: 500">{{p.qty}}</span>
          <button aria-label="Tambah" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #CFE9DA; color: #092017; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">add</span></button>
        </div>
      </sc-for>
      <button style="width: calc(100% + 16px); margin-left: -8px; height: 52px; border: none; border-radius: 26px; background: transparent; color: #006C4E; font-size: 16px; font-weight: 500; text-align: left; padding: 0 8px; display: flex; align-items: center; gap: 8px"><span class="ms" aria-hidden="true">edit_note</span>Catatan / diskon / promo Grab</button>
    </section>
  </main>

  <footer style="flex-shrink: 0; background: #ECEEEB; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 16px; color: #404944"><span>Ongkir (manual)</span><button style="height: 40px; padding: 0 12px 0 16px; border-radius: 20px; border: 1px solid #707973; background: transparent; color: #006C4E; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 4px"><span class="num">0 ៛</span> · Ubah<span class="ms" aria-hidden="true" style="font-size: 18px">edit</span></button></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; font-weight: 500">Total</span><span class="num" style="font-size: 36px; line-height: 44px; font-weight: 400">42.000 ៛</span></div>
    <div class="num" style="display: flex; justify-content: flex-end; gap: 12px; font-size: 14px; color: #404944; margin-top: -6px"><span>≈ $10.25</span><span>≈ Rp 168.000</span></div>
    <div style="display: flex; gap: 12px; margin-top: 4px">
      <button style="width: 104px; height: 56px; border-radius: 28px; border: 1px solid #BA1A1A; background: transparent; color: #BA1A1A; font-size: 16px; font-weight: 500">Batal</button>
      <a href="Bayar.dc.html" style="flex-grow: 1; height: 56px; border-radius: 28px; background: #006C4E; color: #FFFFFF; font-size: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><span class="ms" aria-hidden="true">payments</span>Bayar</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { nama: 'Ayam Goreng', sub: '2 × 10.000 = 20.000 ៛', catatan: 'Paha atas · Tidak pedas · + Nasi putih', qty: 2 },
        { nama: 'Pempek Kapal Selam', sub: '1 × 14.000 = 14.000 ៛', catatan: 'Tambah cuko', qty: 1 },
        { nama: 'Es Teh Manis', sub: '2 × 4.000 = 8.000 ៛', catatan: '', qty: 2 }
      ]
    };
  }
}
</script>
</body>
</html>
