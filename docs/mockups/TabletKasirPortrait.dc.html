<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tablet tegak – Kasir (rail + grid, pesanan di side sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=add,apps,block,check,close,edit,edit_note,history,notifications_active,payments,point_of_sale,remove,restaurant,search,shopping_bag,table_restaurant&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 768px; height: 1024px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; position: relative; font-size: 17px; line-height: 24px; overflow: hidden">
  <nav aria-label="Navigasi utama" style="flex-shrink: 0; width: 80px; height: 100%; box-sizing: border-box; background: #ECEEEB; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 20px">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #E1E3DF; border: 2px dashed #BFC9C2; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #404944; margin-bottom: 12px">LOGO</div>
    <a href="Main.dc.html" aria-label="Kasir" aria-current="page" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #191C1A"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: #CFE9DA; display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true" style="color: #092017">point_of_sale</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kasir</span></a>
    <a href="Meja.dc.html" aria-label="Meja, 1 baru" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">table_restaurant</span><span aria-hidden="true" style="position: absolute; top: -4px; left: 32px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #BA1A1A; color: #FFFFFF; font-size: 14px; font-weight: 500; line-height: 20px; text-align: center">1</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Meja</span></a>
    <a href="OrderWeb.dc.html" aria-label="Online, 2 baru" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">notifications_active</span><span aria-hidden="true" style="position: absolute; top: -4px; left: 32px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #BA1A1A; color: #FFFFFF; font-size: 14px; font-weight: 500; line-height: 20px; text-align: center">2</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Online</span></a>
    <a href="#" aria-label="Riwayat" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">history</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Riwayat</span></a>
    <div style="flex-grow: 1"></div><a href="Lainnya.dc.html" aria-label="Lainnya" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">apps</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lainnya</span></a>
  </nav>

  <section aria-label="Menu" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
    <header style="flex-shrink: 0; padding: 12px 20px 8px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div style="display: flex; flex-direction: column; flex-shrink: 0">
          <h1 class="num" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400">Order #12</h1>
          <span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #404944">Shift Pagi · [Nama kasir]</span>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; gap: 12px; height: 56px; border-radius: 28px; background: #E7E9E5; padding: 0 16px">
          <span class="ms" aria-hidden="true" style="color: #404944">search</span>
          <input aria-label="Cari menu" placeholder="Cari menu…" style="flex-grow: 1; min-width: 0; height: 100%; border: none; background: transparent; font-size: 17px; color: #191C1A; outline: none">
        </div>
      </div>
      <nav aria-label="Kategori" style="display: flex; gap: 8px; flex-wrap: wrap">
        <button aria-pressed="true" style="height: 40px; padding: 0 16px 0 8px; border-radius: 8px; border: none; background: #CFE9DA; color: #092017; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span>Semua</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500">Ayam</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500">Pempek</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500">Minuman</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500">Tambahan</button>
      </nav>
    </header>
    <main style="flex-grow: 1; overflow-y: auto; padding: 4px 20px 104px; min-height: 0">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px">
        <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
          <button style="position: relative; display: flex; flex-direction: column; padding: 0; border-radius: 12px; border: {{m.border}}; background: {{m.bg}}; color: #191C1A; overflow: hidden; text-align: left; opacity: {{m.op}}; box-shadow: {{m.shadow}}; box-sizing: border-box">
            <div style="height: 96px; width: 100%; background: #E1E3DF; display: flex; align-items: center; justify-content: center; color: #707973"><span class="ms" aria-hidden="true" style="font-size: 32px">restaurant</span></div>
            <div style="padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px; width: 100%; box-sizing: border-box">
              <span style="font-size: 18px; line-height: 24px; font-weight: 500">{{m.nama}}</span>
              <span class="num" style="font-size: 17px; line-height: 24px; color: #404944">{{m.harga}}</span>
            </div>
            <sc-if value="{{m.inCart}}" hint-placeholder-val="{{false}}">
              <span class="num" style="position: absolute; top: 8px; right: 8px; min-width: 36px; height: 36px; border-radius: 18px; background: #006C4E; color: #FFFFFF; font-size: 18px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{m.qty}}</span>
            </sc-if>
            <sc-if value="{{m.habis}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 30px; left: 0; right: 0; display: flex; justify-content: center"><span style="display: flex; align-items: center; gap: 4px; background: #FFDAD6; color: #410002; font-size: 16px; font-weight: 500; padding: 4px 12px 4px 8px; border-radius: 8px"><span class="ms" aria-hidden="true" style="font-size: 18px">block</span>Habis</span></span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </main>
  </section>

  <button onClick="{{openSheet}}" style="position: absolute; right: 20px; bottom: 20px; height: 64px; padding: 0 20px 0 16px; border-radius: 16px; border: none; background: #006C4E; color: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 500; box-shadow: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3)"><span class="ms f" aria-hidden="true">shopping_bag</span><span class="num">3 item · 42.000 ៛</span><span>Lihat pesanan</span></button>
  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
  <div onClick="{{closeSheet}}" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.32)"></div>
  <aside role="dialog" aria-modal="true" aria-label="Pesanan" style="position: absolute; top: 0; right: 0; bottom: 0; width: 400px; display: flex; flex-direction: column; background: #F2F4F0; border-radius: 16px 0 0 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15)">
    <div style="flex-shrink: 0; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px"><h2 class="num" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; flex-grow: 1">Pesanan · Order #12</h2><button onClick="{{closeSheet}}" aria-label="Tutup pesanan" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: transparent; color: #404944; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></button></div>
      <div role="radiogroup" aria-label="Tipe order" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <button role="radio" style="height: 44px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; padding: 0 2px">Makan sini</button>
        <button role="radio" style="height: 44px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; padding: 0 2px">Bungkus</button>
        <button role="radio" aria-checked="true" style="height: 44px; border-radius: 8px; border: none; background: #CFE9DA; color: #092017; font-size: 14px; font-weight: 500; padding: 0 2px; display: flex; align-items: center; justify-content: center; gap: 2px"><span class="ms" aria-hidden="true" style="font-size: 16px">check</span>Delivery</button>
        <button role="radio" style="height: 44px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; padding: 0 2px; display: flex; align-items: center; justify-content: center; gap: 4px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #00B14F"></span>Grab</button>
        <button role="radio" style="height: 44px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; padding: 0 2px; display: flex; align-items: center; justify-content: center; gap: 4px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #D70F64"></span>foodpanda</button>
        <button role="radio" style="height: 44px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; padding: 0 2px">Telegram</button>
      </div>
    </div>
    <div style="flex-grow: 1; overflow-y: auto; min-height: 0; padding: 0 16px">
      <div style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; padding: 0 12px">
        <sc-for list="{{items}}" as="p" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid #ECEEEB">
            <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 17px; line-height: 22px; font-weight: 500">{{p.nama}}</span>
              <span class="num" style="font-size: 14px; line-height: 20px; color: #404944">{{p.sub}}</span>
              <span style="font-size: 14px; line-height: 20px; color: #BA1A1A; font-weight: 500">{{p.catatan}}</span>
            </div>
            <button aria-label="Kurangi" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #707973; background: transparent; color: #191C1A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">remove</span></button>
            <span class="num" style="width: 22px; text-align: center; font-size: 19px; font-weight: 500">{{p.qty}}</span>
            <button aria-label="Tambah" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #CFE9DA; color: #092017; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">add</span></button>
          </div>
        </sc-for>
        <button style="width: 100%; height: 48px; border: none; background: transparent; color: #006C4E; font-size: 15px; font-weight: 500; text-align: left; padding: 0; display: flex; align-items: center; gap: 6px"><span class="ms" aria-hidden="true">edit_note</span>Catatan / diskon / promo Grab</button>
      </div>
    </div>
    <div style="flex-shrink: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 4px; background: #ECEEEB">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #404944"><span>Ongkir (manual)</span><button style="height: 40px; padding: 0 12px 0 14px; border-radius: 20px; border: 1px solid #707973; background: transparent; color: #006C4E; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 4px"><span class="num">0 ៛</span> · Ubah<span class="ms" aria-hidden="true" style="font-size: 18px">edit</span></button></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; font-weight: 500">Total</span><span class="num" style="font-size: 32px; line-height: 40px">42.000 ៛</span></div>
      <div class="num" style="display: flex; justify-content: flex-end; gap: 12px; font-size: 14px; color: #404944; margin-top: -4px"><span>≈ $10.25</span><span>≈ Rp 168.000</span></div>
      <div style="display: flex; gap: 10px; margin-top: 6px">
        <button style="width: 100px; height: 56px; border-radius: 28px; border: 1px solid #BA1A1A; background: transparent; color: #BA1A1A; font-size: 16px; font-weight: 500">Batal</button>
        <a href="Bayar.dc.html" style="flex-grow: 1; height: 56px; border-radius: 28px; background: #006C4E; color: #FFFFFF; font-size: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><span class="ms" aria-hidden="true">payments</span>Bayar</a>
      </div>
    </div>
  </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    const m = (nama, harga, qty, habis) => ({ nama, harga, qty: qty || 0, inCart: !!qty, habis: !!habis, op: habis ? 0.6 : 1, bg: habis ? '#ECEEEB' : '#FFFFFF', border: qty ? '2px solid #006C4E' : 'none', shadow: habis ? 'none' : '0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15)' });
    return {
      open: this.state.open, openSheet: () => this.setState({ open: true }), closeSheet: () => this.setState({ open: false }),
      menu: [
        m('Ayam Goreng', '10.000 ៛', 2),
        m('Ayam Bakar', '12.000 ៛'),
        m('Pempek Kapal Selam', '14.000 ៛', 1),
        m('Pempek Lenjer', '10.000 ៛', 0, true),
        m('Kopi Susu', '6.000 ៛'),
        m('Es Teh Manis', '4.000 ៛', 2),
        m('Nasi Putih', '2.000 ៛'),
        m('Kerupuk', '2.000 ៛')
      ],
      items: [
        { nama: 'Ayam Goreng', sub: '2 × 10.000 = 20.000 ៛', catatan: 'Paha atas · Tidak pedas · + Nasi putih', qty: 2 },
        { nama: 'Pempek Kapal Selam', sub: '1 × 14.000 = 14.000 ៛', catatan: 'Tambah cuko', qty: 1 },
        { nama: 'Es Teh Manis', sub: '2 × 4.000 = 8.000 ៛', catatan: '', qty: 2 }
      ]
    };
  }
}
</script>
</body>
</html>
