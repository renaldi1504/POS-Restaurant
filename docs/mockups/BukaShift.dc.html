<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Buka shift – modal awal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=add,play_arrow,remove&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; font-size: 17px; line-height: 24px; overflow: hidden">

  <header style="flex-shrink: 0; background: #F8FAF6; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400">Buka Shift Pagi</h1>
    <span style="font-size: 16px; line-height: 22px; color: #404944">Hitung uang di laci sebelum mulai jualan</span>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <div role="tablist" aria-label="Mata uang" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 60px; border: 1px solid #707973; border-radius: 30px; overflow: hidden; flex-shrink: 0">
      <button role="tab" aria-selected="true" style="border: none; background: #CFE9DA; color: #092017; font-size: 15px; line-height: 20px; font-weight: 500">Riel<br><span class="num">250.000</span></button>
      <button role="tab" style="border: none; border-left: 1px solid #707973; background: transparent; color: #191C1A; font-size: 15px; line-height: 20px; font-weight: 500">Dollar<br><span class="num">$20</span></button>
      <button role="tab" style="border: none; border-left: 1px solid #707973; background: transparent; color: #191C1A; font-size: 15px; line-height: 20px; font-weight: 500">Rupiah<br><span class="num">Rp 0</span></button>
    </div>
    <section style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; padding: 0 16px">
      <sc-for list="{{pecahan}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 72px; border-bottom: 1px solid #BFC9C2">
          <div style="flex-grow: 1; display: flex; flex-direction: column"><span class="num" style="font-size: 18px; line-height: 24px; font-weight: 500">{{r.nominal}}</span><span class="num" style="font-size: 16px; line-height: 22px; color: #404944">= {{r.jumlah}}</span></div>
          <button aria-label="Kurangi" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #707973; background: transparent; color: #191C1A; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">remove</span></button>
          <span class="num" style="width: 32px; text-align: center; font-size: 22px; font-weight: 500">{{r.lembar}}</span>
          <button aria-label="Tambah" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #CFE9DA; color: #092017; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">add</span></button>
        </div>
      </sc-for>
    </section>
  </main>

  <footer style="flex-shrink: 0; background: #ECEEEB; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 16px; color: #404944">Total modal (dalam Riel)</span><span class="num" style="font-size: 32px; line-height: 40px; font-weight: 400; color: #006C4E">332.000 ៛</span></div>
    <span class="num" style="font-size: 14px; color: #404944; margin-top: -6px; text-align: right">250.000 ៛ + $20 (kurs 4.100)</span>
    <a href="Main.dc.html" style="height: 64px; margin-top: 4px; border-radius: 32px; background: #006C4E; color: #FFFFFF; font-size: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><span class="ms" aria-hidden="true">play_arrow</span>Mulai shift</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pecahan: [
        { nominal: '100.000 ៛', lembar: 1, jumlah: '100.000 ៛' },
        { nominal: '50.000 ៛', lembar: 2, jumlah: '100.000 ៛' },
        { nominal: '20.000 ៛', lembar: 1, jumlah: '20.000 ៛' },
        { nominal: '10.000 ៛', lembar: 2, jumlah: '20.000 ៛' },
        { nominal: '5.000 ៛', lembar: 2, jumlah: '10.000 ៛' },
        { nominal: '1.000 ៛', lembar: 0, jumlah: '0 ៛' }
      ]
    };
  }
}
</script>
</body>
</html>
