<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tablet – Dapur (tiket multi-kolom, 4 bahasa)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=alarm,apps,check,fiber_new,inventory_2,local_fire_department,print,skillet,task_alt,volume_up&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; font-size: 17px; line-height: 24px; overflow: hidden">
  <nav aria-label="Navigasi utama" style="flex-shrink: 0; width: 80px; height: 100%; box-sizing: border-box; background: #ECEEEB; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 20px">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #E1E3DF; border: 2px dashed #BFC9C2; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #404944; margin-bottom: 12px">LOGO</div>
    <a href="Dapur.dc.html" aria-label="{{t.n_dapur}}, 3 baru" aria-current="page" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #191C1A"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: #CFE9DA; display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true" style="color: #092017">skillet</span><span aria-hidden="true" style="position: absolute; top: -4px; left: 32px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #BA1A1A; color: #FFFFFF; font-size: 14px; font-weight: 500; line-height: 20px; text-align: center">3</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.n_dapur}}</span></a>
    <a href="#" aria-label="{{t.n_selesai}}" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">task_alt</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.n_selesai}}</span></a>
    <a href="#" aria-label="{{t.n_stok}}" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">inventory_2</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.n_stok}}</span></a>
    <a href="#" aria-label="{{t.n_printer}}" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">print</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.n_printer}}</span></a>
    <div style="flex-grow: 1"></div><a href="Lainnya.dc.html" aria-label="{{t.n_lainnya}}" style="width: 80px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #404944"><span style="position: relative; width: 56px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">apps</span></span><span style="max-width: 76px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.n_lainnya}}</span></a>
  </nav>

  <section style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
    <header style="flex-shrink: 0; padding: 12px 20px 10px; display: flex; align-items: center; gap: 16px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
        <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400">{{t.title}}</h1>
        <span style="font-size: 16px; line-height: 22px; color: #404944">{{t.active}}</span>
      </div>
      <div role="group" aria-label="Bahasa" style="display: grid; grid-template-columns: repeat(4, 76px); height: 48px; border: 1px solid #707973; border-radius: 24px; overflow: hidden; flex-shrink: 0">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
          <button onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="border: none; border-left: {{l.sep}}; background: {{l.bg}}; color: {{l.fg}}; font-size: 16px; font-weight: 500">{{l.label}}</button>
        </sc-for>
      </div>
      <button aria-label="{{t.sound}}" aria-pressed="true" style="height: 48px; padding: 0 16px 0 12px; border-radius: 24px; border: none; background: #CFE9DA; color: #092017; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap"><span class="ms f" aria-hidden="true" style="font-size: 20px">volume_up</span>{{t.sound}}</button>
    </header>

    <div style="flex-shrink: 0; margin: 0 20px; background: #E1E3DF; border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 500">{{t.toMake}}</h2>
      <sc-for list="{{recap}}" as="r" hint-placeholder-count="6">
        <span style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 2px 12px; border-radius: 8px; background: #FFFFFF; font-size: 16px; line-height: 22px"><b class="num" style="font-size: 18px; font-weight: 700">{{r.q}}</b>× {{r.name}}</span>
      </sc-for>
    </div>

    <main style="flex-grow: 1; overflow-y: auto; padding: 12px 20px 20px; min-height: 0">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start">
        <sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
          <article style="background: #FFFFFF; border: {{o.border}}; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden">
            <div style="background: {{o.headBg}}; color: {{o.headFg}}; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px">
              <span class="num" style="font-size: 28px; line-height: 36px; font-weight: 500">{{o.no}}</span>
              <span style="display: flex; align-items: center; gap: 4px; font-size: 16px; line-height: 22px; font-weight: 500"><span class="ms" aria-hidden="true" style="font-size: 20px">{{o.icon}}</span>{{o.time}}</span>
            </div>
            <div style="padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #404944">{{o.type}}</span>
              <sc-for list="{{o.items}}" as="it" hint-placeholder-count="2">
                <div style="display: flex; gap: 8px; align-items: baseline">
                  <b class="num" style="font-size: 22px; font-weight: 700; flex-shrink: 0">{{it.q}}×</b>
                  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                    <span style="font-size: 20px; line-height: 28px; font-weight: 500">{{it.name}}</span>
                    <sc-if value="{{it.hasNote}}" hint-placeholder-val="{{false}}">
                      <span style="font-size: 16px; line-height: 22px; color: #BA1A1A; font-weight: 500">{{it.note}}</span>
                    </sc-if>
                  </div>
                </div>
              </sc-for>
              <button style="min-height: 56px; margin-top: 4px; padding: 4px 12px; border-radius: 28px; border: none; background: {{o.btnBg}}; color: #FFFFFF; font-size: 19px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" aria-hidden="true">{{o.btnIcon}}</span>{{o.btn}}</button>
            </div>
          </article>
        </sc-for>
      </div>
    </main>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'id' }; }
  renderVals() {
    const L = this.state.lang;
    const T = {
      id: { title: 'Dapur', active: '3 order aktif', sound: 'Bunyi ON', min: 'menit', nu: 'Baru', ready: 'Siap', start: 'Mulai masak', cooking: 'dimasak', dine: 'MAKAN SINI · MEJA 2', grab: 'GRAB', deliv: 'DELIVERY · driver ambil saat Siap', toMake: 'Yang harus dibuat', n_dapur: 'Dapur', n_selesai: 'Selesai', n_stok: 'Stok menu', n_printer: 'Printer', n_lainnya: 'Lainnya' },
      en: { title: 'Kitchen', active: '3 active orders', sound: 'Sound ON', min: 'min', nu: 'New', ready: 'Ready', start: 'Start cooking', cooking: 'cooking', dine: 'DINE-IN · TABLE 2', grab: 'GRAB', deliv: 'DELIVERY · driver picks up when Ready', toMake: 'To make', n_dapur: 'Kitchen', n_selesai: 'Done', n_stok: 'Stock', n_printer: 'Printer', n_lainnya: 'More' },
      kh: { title: 'ផ្ទះបាយ', active: 'ការកម្ម៉ង់ 3', sound: 'សំឡេង បើក', min: 'នាទី', nu: 'ថ្មី', ready: 'រួចរាល់', start: 'ចាប់ផ្តើមចម្អិន', cooking: 'កំពុងចម្អិន', dine: 'ញ៉ាំនៅហាង · តុ 2', grab: 'GRAB', deliv: 'ដឹកជញ្ជូន · អ្នកដឹកមកយកពេលរួចរាល់', toMake: 'ត្រូវធ្វើ', n_dapur: 'ផ្ទះបាយ', n_selesai: 'បានធ្វើ', n_stok: 'ស្តុក', n_printer: 'ព្រីន', n_lainnya: 'ផ្សេងៗ' },
      zh: { title: '厨房', active: '3 个订单', sound: '声音 开', min: '分钟', nu: '新', ready: '完成', start: '开始做', cooking: '正在做', dine: '堂食 · 2号桌', grab: 'GRAB', deliv: '外送 · 完成后司机取餐', toMake: '需要做', n_dapur: '厨房', n_selesai: '已完成', n_stok: '库存', n_printer: '打印机', n_lainnya: '更多' }
    };
    const N = {
      goreng: { id: 'Ayam Goreng', en: 'Fried Chicken', kh: 'មាន់បំពង', zh: '炸鸡' },
      bakar: { id: 'Ayam Bakar', en: 'Grilled Chicken', kh: 'មាន់អាំង', zh: '烤鸡' },
      pks: { id: 'Pempek Kapal Selam', en: 'Pempek with Egg', kh: 'ប៉េមប៉េកពងមាន់', zh: '巨港鱼饼（含蛋）' },
      nasi: { id: 'Nasi Putih', en: 'Steamed Rice', kh: 'បាយស', zh: '白饭' },
      esteh: { id: 'Es Teh Manis', en: 'Sweet Iced Tea', kh: 'តែទឹកកកផ្អែម', zh: '冰甜茶' },
      kopi: { id: 'Kopi Susu', en: 'Milk Coffee', kh: 'កាហ្វេទឹកដោះគោ', zh: '奶咖啡' },
      nopedas: { id: 'Paha atas · Tidak pedas · + Nasi', en: 'Thigh · Not spicy · + Rice', kh: 'ភ្លៅ · មិនហឹរ · + បាយ', zh: '鸡腿 · 不辣 · + 白饭' },
      cuko: { id: 'Tambah cuko', en: 'Extra cuko sauce', kh: 'ថែមទឹកជ្រលក់', zh: '多加醋酱' }
    };
    const t = T[L];
    const tone = {
      late: { border: '2px solid #BA1A1A', headBg: '#FFDAD6', headFg: '#410002', icon: 'alarm' },
      cook: { border: '1px solid #BFC9C2', headBg: '#FFDF9F', headFg: '#261A00', icon: 'skillet' },
      nu: { border: '2px solid #3E6374', headBg: '#C1E8FC', headFg: '#001F2A', icon: 'fiber_new' }
    };
    const raw = [
      { no: '#12', m: 1, tone: 'nu', type: t.deliv, items: [['goreng', 2, 'nopedas'], ['pks', 1, 'cuko'], ['esteh', 2]] },
      { no: '#10', m: 18, tone: 'late', type: t.dine, items: [['bakar', 1], ['nasi', 2]] },
      { no: 'GF-482', m: 9, tone: 'cook', type: t.grab, items: [['pks', 2], ['kopi', 1]] }
    ];
    const orders = raw.map(o => {
      const isNew = o.tone === 'nu';
      return {
        ...tone[o.tone], no: o.no, type: o.type,
        time: isNew ? t.nu + ' · ' + o.m + ' ' + t.min : o.m + ' ' + t.min + ' · ' + t.cooking,
        btn: isNew ? t.start : t.ready, btnBg: isNew ? '#3E6374' : '#006C4E', btnIcon: isNew ? 'local_fire_department' : 'check',
        items: o.items.map(([k, q, n]) => ({ q, name: N[k][L], hasNote: !!n, note: n ? N[n][L] : '' }))
      };
    });
    const tot = {};
    raw.forEach(o => o.items.forEach(([k, q]) => { tot[k] = (tot[k] || 0) + q; }));
    const recap = Object.keys(tot).sort((a, b) => tot[b] - tot[a]).map(k => ({ name: N[k][L], q: tot[k] }));
    const langs = [['id', 'ID'], ['en', 'EN'], ['kh', 'ខ្មែរ'], ['zh', '中文']].map(([k, label], i) => ({
      label, pick: () => this.setState({ lang: k }), on: k === L ? 'true' : 'false',
      bg: k === L ? '#CFE9DA' : 'transparent', fg: k === L ? '#092017' : '#191C1A', sep: i ? '1px solid #707973' : 'none'
    }));
    return { t, orders, recap, langs };
  }
}
</script>
</body>
</html>
