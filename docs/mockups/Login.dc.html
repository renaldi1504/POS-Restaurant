<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login – pilih pengguna</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=backspace,login&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 20px; gap: 14px; font-size: 17px; line-height: 24px; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #E1E3DF; border: 2px dashed #BFC9C2; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #404944">LOGO</div>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500">[Nama Restoran]</h1>
    <span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #404944">Buka hari ini 08.00 – 03.00</span>
  </div>

  <h2 style="margin: 2px 0 0; font-size: 18px; line-height: 24px; font-weight: 500; align-self: flex-start">Siapa yang masuk?</h2>
  <div role="radiogroup" aria-label="Pengguna" style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: -4px">
    <sc-for list="{{users}}" as="u" hint-placeholder-count="4">
      <button role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="height: 72px; border-radius: 12px; border: {{u.border}}; background: {{u.bg}}; color: #191C1A; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; box-sizing: border-box">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: {{u.avBg}}; color: {{u.avFg}}; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{u.ini}}</span>
        <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 16px; line-height: 22px; font-weight: 500">{{u.nama}}</span>
          <span style="align-self: flex-start; padding: 0 6px; border-radius: 6px; background: {{u.roleBg}}; color: {{u.roleFg}}; font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap">{{u.role}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <h2 style="margin: 2px 0 0; font-size: 18px; line-height: 24px; font-weight: 500">PIN untuk {{selName}}</h2>
  <div aria-label="2 dari 4 angka diisi" style="display: flex; gap: 18px; align-items: center; height: 24px">
    <span style="width: 18px; height: 18px; border-radius: 9px; background: #006C4E"></span>
    <span style="width: 18px; height: 18px; border-radius: 9px; background: #006C4E"></span>
    <span style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #707973; box-sizing: border-box"></span>
    <span style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #707973; box-sizing: border-box"></span>
  </div>

  <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">1</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">2</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">3</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">4</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">5</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">6</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">7</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">8</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">9</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: transparent; color: #BA1A1A; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms" aria-hidden="true" style="font-size: 22px">backspace</span>Hapus</button>
    <button style="height: 64px; border-radius: 32px; border: none; background: #E7E9E5; color: #191C1A; font-size: 28px; font-weight: 400">0</button>
    <a href="BukaShift.dc.html" style="height: 64px; border-radius: 32px; background: #006C4E; color: #FFFFFF; font-size: 18px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none">Masuk<span class="ms" aria-hidden="true" style="font-size: 22px">login</span></a>
  </div>
  <span style="font-size: 14px; line-height: 18px; color: #404944; text-align: center">Shift (pagi/malam) dipilih saat buka shift, bukan di login</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 1 }; }
  renderVals() {
    const R = {
      Owner: { bg: '#2E312F', fg: '#EFF1ED', av: '#2E312F', avFg: '#FFFFFF' },
      Kasir: { bg: '#87F8C9', fg: '#002115', av: '#006C4E', avFg: '#FFFFFF' },
      Dapur: { bg: '#FFDF9F', fg: '#261A00', av: '#795900', avFg: '#FFFFFF' }
    };
    const list = [['[Nama 1]', 'N1', 'Owner', 'Admin / Owner'], ['[Nama 2]', 'N2', 'Kasir', 'Kasir'], ['[Nama 3]', 'N3', 'Kasir', 'Kasir'], ['[Nama 4]', 'N4', 'Dapur', 'Dapur']];
    const sel = this.state.sel;
    const users = list.map(([nama, ini, k, role], i) => ({
      nama, ini, role, pick: () => this.setState({ sel: i }), on: i === sel ? 'true' : 'false',
      roleBg: R[k].bg, roleFg: R[k].fg, avBg: R[k].av, avFg: R[k].avFg,
      bg: i === sel ? '#CFE9DA' : '#FFFFFF', border: i === sel ? '2px solid #006C4E' : '1px solid #BFC9C2'
    }));
    return { users, selName: list[sel][0] };
  }
}
</script>
</body>
</html>
