<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir – tagihan meja (open bill)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=add,arrow_back,payments,print,restaurant&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; font-size: 17px; line-height: 24px; overflow: hidden">

  <header style="flex-shrink: 0; height: 72px; background: #F8FAF6; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px">
    <a href="Meja.dc.html" aria-label="Kembali ke Meja" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #191C1A; text-decoration: none; flex-shrink: 0"><span class="ms" aria-hidden="true">arrow_back</span></a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500">Meja 5</h1><span style="font-size: 14px; line-height: 18px; color: #404944">Duduk 32 menit · 4 kursi</span></div>
    <span style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px 0 8px; border-radius: 8px; background: #C1E8FC; color: #001F2A; font-size: 14px; font-weight: 500; flex-shrink: 0"><span class="ms f" aria-hidden="true" style="font-size: 18px">restaurant</span>Sedang makan</span>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <sc-for list="{{rounds}}" as="r" hint-placeholder-count="2">
      <section style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; padding: 4px 16px 8px; display: flex; flex-direction: column; flex-shrink: 0">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; border-bottom: 1px solid #BFC9C2">
          <span style="display: flex; align-items: center; gap: 8px"><span class="num" style="font-size: 16px; font-weight: 500">{{r.no}}</span><span style="padding: 2px 8px; border-radius: 8px; background: {{r.srcBg}}; color: {{r.srcFg}}; font-size: 14px; line-height: 18px; font-weight: 500">{{r.src}}</span></span>
          <span style="font-size: 14px; font-weight: 500; color: {{r.stColor}}; text-align: right">{{r.status}}</span>
        </div>
        <sc-for list="{{r.items}}" as="it" hint-placeholder-count="2">
          <div style="display: flex; justify-content: space-between; gap: 8px; padding: 8px 0">
            <span style="display: flex; flex-direction: column"><span style="font-weight: 500">{{it.q}} × {{it.nama}}</span><span style="font-size: 16px; line-height: 22px; color: #404944">{{it.opsi}}</span></span>
            <span class="num" style="flex-shrink: 0; font-weight: 500">{{it.harga}}</span>
          </div>
        </sc-for>
      </section>
    </sc-for>

    <a href="Main.dc.html" style="height: 48px; border-radius: 24px; background: #CFE9DA; color: #092017; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; flex-shrink: 0"><span class="ms" aria-hidden="true">add</span>Tambah pesanan ke Meja 5</a>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex-shrink: 0">
      <button style="height: 48px; border-radius: 24px; border: 1px solid #707973; background: transparent; color: #006C4E; font-size: 15px; font-weight: 500; padding: 0 4px">Pindah meja</button>
      <button style="height: 48px; border-radius: 24px; border: 1px solid #707973; background: transparent; color: #006C4E; font-size: 15px; font-weight: 500; padding: 0 4px">Gabung meja</button>
      <button style="height: 48px; border-radius: 24px; border: 1px solid #707973; background: transparent; color: #006C4E; font-size: 15px; font-weight: 500; padding: 0 4px">Split bill</button>
    </div>
  </main>

  <footer style="flex-shrink: 0; background: #ECEEEB; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 16px; color: #404944"><span>Subtotal 2 ronde · 7 item</span><span class="num">62.000 ៛</span></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; font-weight: 500">Total tagihan</span><span class="num" style="font-size: 32px; line-height: 40px; font-weight: 400">62.000 ៛</span></div>
    <div style="display: flex; gap: 12px; margin-top: 4px">
      <a href="Nota.dc.html" style="width: 140px; height: 56px; border-radius: 28px; border: 1px solid #707973; color: #006C4E; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; box-sizing: border-box"><span class="ms" aria-hidden="true" style="font-size: 20px">print</span>Cetak nota</a>
      <a href="Bayar.dc.html" style="flex-grow: 1; height: 56px; border-radius: 28px; background: #006C4E; color: #FFFFFF; font-size: 18px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><span class="ms" aria-hidden="true">payments</span>Bayar</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rounds: [
        { no: 'Order #18 · 12:10', src: 'QR MEJA', srcBg: '#87F8C9', srcFg: '#002115', status: 'Sudah diantar', stColor: '#006C4E', items: [
          { q: 2, nama: 'Ayam Goreng', opsi: 'Paha atas · Tidak pedas', harga: '20.000 ៛' },
          { q: 1, nama: 'Pempek Kapal Selam', opsi: 'Level: Sedang', harga: '14.000 ៛' },
          { q: 2, nama: 'Es Teh Manis', opsi: 'Kurang manis', harga: '8.000 ៛' }
        ] },
        { no: 'Order #21 · 12:30', src: 'KASIR', srcBg: '#E1E3DF', srcFg: '#191C1A', status: 'Dimasak', stColor: '#795900', items: [
          { q: 1, nama: 'Ayam Bakar', opsi: 'Dada · Pedas · + Nasi putih', harga: '14.000 ៛' },
          { q: 1, nama: 'Kopi Susu', opsi: 'Normal', harga: '6.000 ៛' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
