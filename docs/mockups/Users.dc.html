<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pengguna &amp; role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=arrow_back,block,check_circle&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; font-size: 17px; line-height: 24px; position: relative; overflow: hidden">

  <header style="flex-shrink: 0; background: #F8FAF6; display: flex; flex-direction: column">
    <div style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px">
      <a href="Settings.dc.html" aria-label="Kembali ke Settings" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #191C1A; text-decoration: none; flex-shrink: 0"><span class="ms" aria-hidden="true">arrow_back</span></a>
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500">Pengguna &amp; Role</h1>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #BFC9C2">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="position: relative; height: 52px; border: none; background: transparent; color: {{t.fg}}; font-size: 16px; font-weight: 500">{{t.label}}<span style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: {{t.barW}}; height: 3px; border-radius: 3px 3px 0 0; background: #006C4E"></span></button>
      </sc-for>
    </div>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 12px 16px 100px; display: flex; flex-direction: column; gap: 8px; min-height: 0">
    <sc-if value="{{isUsers}}" hint-placeholder-val="{{true}}">
      <div style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden">
        <sc-for list="{{users}}" as="u" hint-placeholder-count="5">
          <div style="min-height: 72px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #ECEEEB; box-sizing: border-box">
            <span style="width: 40px; height: 40px; border-radius: 20px; background: {{u.av}}; color: {{u.avFg}}; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{u.ini}}</span>
            <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 17px; line-height: 24px; font-weight: 500">{{u.nama}}</span>
              <span style="font-size: 14px; line-height: 18px; color: #404944">{{u.ket}}</span>
            </div>
            <span style="padding: 2px 8px; border-radius: 8px; background: {{u.roleBg}}; color: {{u.roleFg}}; font-size: 14px; line-height: 20px; font-weight: 500; flex-shrink: 0; white-space: nowrap">{{u.role}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 14px; line-height: 20px; color: #404944; padding: 4px 4px">Tekan pengguna untuk ubah nama, role, PIN, atau nonaktifkan. Bot Telegram adalah pengguna sistem: tidak bisa login, hanya membuat order online.</span>
    </sc-if>

    <sc-if value="{{isRoles}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
        <section style="background: #FFFFFF; border: 1px solid #BFC9C2; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="padding: 2px 10px; border-radius: 8px; background: {{r.bg}}; color: {{r.fg}}; font-size: 15px; line-height: 22px; font-weight: 500">{{r.nama}}</span><span style="font-size: 14px; color: #404944">{{r.jumlah}}</span></div>
          <sc-for list="{{r.akses}}" as="a" hint-placeholder-count="4">
            <div style="display: flex; align-items: flex-start; gap: 8px; font-size: 16px; line-height: 22px">
              <span class="ms" aria-hidden="true" style="font-size: 20px; color: {{a.dot}}">{{a.mark}}</span>
              <span style="color: {{a.color}}">{{a.label}}</span>
            </div>
          </sc-for>
        </section>
      </sc-for>
    </sc-if>
  </main>

  <div style="position: absolute; right: 16px; bottom: 16px">
    <button style="height: 56px; padding: 0 20px; border-radius: 16px; border: none; background: #87F8C9; color: #002115; font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3)">{{addLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'users' }; }
  renderVals() {
    const tab = this.state.tab;
    const R = {
      owner: { nama: 'Admin / Owner', bg: '#2E312F', fg: '#EFF1ED', av: '#2E312F', avFg: '#FFFFFF' },
      kasir: { nama: 'Kasir', bg: '#87F8C9', fg: '#002115', av: '#006C4E', avFg: '#FFFFFF' },
      dapur: { nama: 'Dapur', bg: '#FFDF9F', fg: '#261A00', av: '#795900', avFg: '#FFFFFF' },
      driver: { nama: 'Driver', bg: '#E1E3DF', fg: '#191C1A', av: '#4C6358', avFg: '#FFFFFF' },
      bot: { nama: 'Bot Telegram', bg: '#C1E8FC', fg: '#001F2A', av: '#3E6374', avFg: '#FFFFFF' }
    };
    const U = [
      ['[Nama 1]', 'N1', 'owner', 'Aktif · login terakhir hari ini'],
      ['[Nama 2]', 'N2', 'kasir', 'Aktif · shift pagi'],
      ['[Nama 3]', 'N3', 'kasir', 'Aktif · shift malam'],
      ['[Nama 4]', 'N4', 'dapur', 'Aktif'],
      ['[Nama 5]', 'N5', 'driver', 'Aktif · bahasa: ខ្មែរ'],
      ['Bot Telegram', 'BT', 'bot', 'Pengguna sistem · tidak bisa login']
    ];
    const users = U.map(([nama, ini, k, ket]) => ({ nama, ini, ket, role: R[k].nama, roleBg: R[k].bg, roleFg: R[k].fg, av: R[k].av, avFg: R[k].avFg }));
    const yes = l => ({ label: l, mark: 'check_circle', dot: '#006C4E', color: '#191C1A' });
    const no = l => ({ label: l, mark: 'block', dot: '#707973', color: '#404944' });
    const roles = [
      { ...R.owner, jumlah: '1 pengguna', akses: [yes('Semua fitur kasir & dapur'), yes('Kelola menu, harga, promo'), yes('Dashboard & laporan semua shift'), yes('Settings, pengguna & role'), yes('Batalkan order yang sudah dibayar')] },
      { ...R.kasir, jumlah: '2 pengguna', akses: [yes('Input order & bayar'), yes('Terima / tolak order online'), yes('Buka shift, pengeluaran, closing'), yes('Tandai menu habis'), no('Batalkan order dibayar (perlu PIN admin)'), no('Kelola menu & settings')] },
      { ...R.dapur, jumlah: '1 pengguna', akses: [yes('Layar dapur & ubah status masak'), yes('Tandai menu habis'), no('Kasir, uang, dan laporan')] },
      { ...R.driver, jumlah: '1 pengguna', akses: [yes('Ambil antaran yang sudah siap di dapur'), yes('Lihat peta semua tujuan & navigasi'), yes('Ubah status: diambil, sampai'), no('Kasir, uang, menu, settings')] },
      { ...R.bot, jumlah: 'sistem', akses: [yes('Buat order online (menunggu diterima kasir)'), yes('Kirim notifikasi status ke pelanggan'), no('Login, uang, menu, settings')] }
    ];
    const tabs = [['users', 'Pengguna (6)'], ['roles', 'Role & hak akses']].map(([k, label]) => ({ label, pick: () => this.setState({ tab: k }), on: k === tab ? 'true' : 'false', fg: k === tab ? '#006C4E' : '#404944', barW: k === tab ? '60%' : '0' }));
    return { tabs, users, roles, isUsers: tab === 'users', isRoles: tab === 'roles', addLabel: tab === 'users' ? '+ Tambah pengguna' : '+ Tambah role' };
  }
}
</script>
</body>
</html>
