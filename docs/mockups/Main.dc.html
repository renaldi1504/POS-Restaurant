<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir – pilih menu (HP)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+Khmer:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=apps,block,check,chevron_right,history,notifications_active,point_of_sale,restaurant,search,shopping_bag,table_restaurant&amp;display=block">
<style>
body{margin:0;font-family:Roboto,'Noto Sans Khmer','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;flex-shrink:0;overflow:hidden;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}
a{color:#006C4E}a:hover{color:#00513A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; font-size: 17px; line-height: 24px; position: relative; overflow: hidden">

  <header style="flex-shrink: 0; background: #F8FAF6; padding: 8px 16px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 56px">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #E1E3DF; border: 2px dashed #BFC9C2; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #404944; flex-shrink: 0">LOGO</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
        <h1 class="num" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400">Order #12</h1>
        <span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #404944">Shift Pagi · [Nama kasir]</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-radius: 28px; background: #E7E9E5; padding: 0 16px">
      <span class="ms" aria-hidden="true" style="color: #404944">search</span>
      <input aria-label="Cari menu" placeholder="Cari menu…" style="flex-grow: 1; min-width: 0; height: 100%; border: none; background: transparent; font-size: 17px; color: #191C1A; outline: none">
    </div>
    <nav aria-label="Kategori" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px">
      <button aria-pressed="true" style="height: 40px; padding: 0 16px 0 8px; border-radius: 8px; border: none; background: #CFE9DA; color: #092017; font-size: 14px; font-weight: 500; flex-shrink: 0; display: flex; align-items: center; gap: 8px"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span>Semua</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; flex-shrink: 0">Ayam</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; flex-shrink: 0">Pempek</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; flex-shrink: 0">Minuman</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 14px; font-weight: 500; flex-shrink: 0">Tambahan</button>
    </nav>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 92px; min-height: 0">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
        <button style="position: relative; display: flex; flex-direction: column; padding: 0; border-radius: 12px; border: {{m.border}}; background: {{m.bg}}; color: #191C1A; overflow: hidden; text-align: left; opacity: {{m.op}}; box-shadow: {{m.shadow}}; box-sizing: border-box">
          <div style="height: 88px; width: 100%; background: #E1E3DF; display: flex; align-items: center; justify-content: center; color: #707973"><span class="ms" aria-hidden="true" style="font-size: 32px">restaurant</span></div>
          <div style="padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px; width: 100%; box-sizing: border-box">
            <span style="font-size: 18px; line-height: 24px; font-weight: 500">{{m.nama}}</span>
            <span class="num" style="font-size: 17px; line-height: 24px; color: #404944">{{m.harga}}</span>
          </div>
          <sc-if value="{{m.inCart}}" hint-placeholder-val="{{false}}">
            <span class="num" style="position: absolute; top: 8px; right: 8px; min-width: 36px; height: 36px; border-radius: 18px; background: #006C4E; color: #FFFFFF; font-size: 18px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{m.qty}}</span>
          </sc-if>
          <sc-if value="{{m.habis}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 28px; left: 0; right: 0; display: flex; justify-content: center"><span style="display: flex; align-items: center; gap: 4px; background: #FFDAD6; color: #410002; font-size: 16px; font-weight: 500; padding: 4px 12px 4px 8px; border-radius: 8px"><span class="ms" aria-hidden="true" style="font-size: 18px">block</span>Habis</span></span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 92px">
    <a href="Pesanan.dc.html" style="height: 64px; border-radius: 16px; background: #006C4E; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px; text-decoration: none; box-shadow: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3)">
      <span class="ms f" aria-hidden="true">shopping_bag</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px; line-height: 18px; font-weight: 500; opacity: 0.9">3 item</span><span class="num" style="font-size: 20px; line-height: 26px; font-weight: 500">42.000 ៛</span></span>
      <span style="font-size: 16px; font-weight: 500">Lihat pesanan</span><span class="ms" aria-hidden="true">chevron_right</span>
    </a>
  </div>

  <nav aria-label="Navigasi utama" style="flex-shrink: 0; height: 80px; background: #ECEEEB; display: flex; padding: 0 4px">
    <a href="Main.dc.html" aria-label="Kasir" aria-current="page" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #191C1A"><span style="position: relative; width: 64px; height: 32px; border-radius: 16px; background: #CFE9DA; display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true" style="color: #092017">point_of_sale</span></span><span style="max-width: 100%; padding: 0 2px; box-sizing: border-box; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kasir</span></a>
    <a href="Meja.dc.html" aria-label="Meja, 1 baru" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #404944"><span style="position: relative; width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">table_restaurant</span><span aria-hidden="true" style="position: absolute; top: -4px; left: 36px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #BA1A1A; color: #FFFFFF; font-size: 14px; font-weight: 500; line-height: 20px; text-align: center">1</span></span><span style="max-width: 100%; padding: 0 2px; box-sizing: border-box; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Meja</span></a>
    <a href="OrderWeb.dc.html" aria-label="Online, 2 baru" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #404944"><span style="position: relative; width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">notifications_active</span><span aria-hidden="true" style="position: absolute; top: -4px; left: 36px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #BA1A1A; color: #FFFFFF; font-size: 14px; font-weight: 500; line-height: 20px; text-align: center">2</span></span><span style="max-width: 100%; padding: 0 2px; box-sizing: border-box; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Online</span></a>
    <a href="#" aria-label="Riwayat" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #404944"><span style="position: relative; width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">history</span></span><span style="max-width: 100%; padding: 0 2px; box-sizing: border-box; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Riwayat</span></a>
    <a href="Lainnya.dc.html" aria-label="Lainnya" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; text-decoration: none; color: #404944"><span style="position: relative; width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #404944">apps</span></span><span style="max-width: 100%; padding: 0 2px; box-sizing: border-box; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lainnya</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (nama, harga, qty, habis) => ({ nama, harga, qty: qty || 0, inCart: !!qty, habis: !!habis, op: habis ? 0.6 : 1, bg: habis ? '#ECEEEB' : '#FFFFFF', border: qty ? '2px solid #006C4E' : 'none', shadow: habis ? 'none' : '0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15)' });
    return {
      menu: [
        m('Ayam Goreng', '10.000 ៛', 2),
        m('Ayam Bakar', '12.000 ៛'),
        m('Pempek Kapal Selam', '14.000 ៛', 1),
        m('Pempek Lenjer', '10.000 ៛', 0, true),
        m('Kopi Susu', '6.000 ៛'),
        m('Es Teh Manis', '4.000 ៛', 2),
        m('Nasi Putih', '2.000 ៛'),
        m('Kerupuk', '2.000 ៛')
      ]
    };
  }
}
</script>
</body>
</html>
