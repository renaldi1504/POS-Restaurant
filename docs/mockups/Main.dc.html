<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir – pilih menu (HP)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#047857}a:hover{color:#065F46}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #101828; display: flex; flex-direction: column; font-size: 16px; position: relative; overflow: hidden">

  <header style="flex-shrink: 0; background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #EAECF0">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #F2F4F7; border: 2px dashed #D0D5DD; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #667085; flex-shrink: 0">LOGO</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <b style="font-size: 20px">Order #12</b>
        <span style="font-size: 13px; color: #667085">Shift Pagi · [Nama kasir]</span>
      </div>
      <a href="Meja.dc.html" aria-label="Denah meja" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.05)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></a>
      <button aria-label="Order website, 2 baru" style="position: relative; width: 48px; height: 48px; border-radius: 12px; border: 2px solid #F59E0B; background: #FFFAEB; color: #101828; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; border-radius: 12px; background: #D92D20; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
      </button>
      <button aria-label="Menu lainnya" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
    <div style="position: relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 12px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Cari menu" placeholder="Cari menu…" style="width: 100%; height: 44px; border-radius: 12px; border: 1px solid #D0D5DD; padding: 0 12px 0 40px; font-size: 16px; color: #101828; box-sizing: border-box">
    </div>
    <nav aria-label="Kategori" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px">
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #101828; color: #FFFFFF; font-size: 15px; font-weight: 700; flex-shrink: 0">Semua</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; flex-shrink: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Ayam</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; flex-shrink: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Pempek</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; flex-shrink: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Minuman</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #101828; font-size: 15px; font-weight: 600; flex-shrink: 0; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.07)">Tambahan</button>
    </nav>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 12px 14px 100px; min-height: 0">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
        <button style="position: relative; display: flex; flex-direction: column; padding: 0; border-radius: 14px; border: {{m.border}}; background: {{m.bg}}; color: #101828; overflow: hidden; text-align: left; opacity: {{m.op}}">
          <div style="height: 92px; width: 100%; background: #EEF1F5; display: flex; align-items: center; justify-content: center; color: #98A2B3"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"></path></svg></div>
          <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; width: 100%; box-sizing: border-box">
            <span style="font-size: 16px; font-weight: 700; line-height: 1.25">{{m.nama}}</span>
            <span style="font-size: 17px; font-weight: 800">{{m.harga}}</span>
          </div>
          <sc-if value="{{m.inCart}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 17px; background: #047857; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{m.qty}}</span>
          </sc-if>
          <sc-if value="{{m.habis}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 30px; left: 0; right: 0; text-align: center"><span style="background: #B42318; color: #FFFFFF; font-size: 16px; font-weight: 800; padding: 5px 14px; border-radius: 8px">Habis</span></span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 16px">
    <a href="Pesanan.dc.html" style="height: 64px; border-radius: 16px; background: #047857; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; text-decoration: none; box-shadow: 0 4px 14px rgba(0,0,0,0.18)">
      <span style="display: flex; flex-direction: column"><span style="font-size: 14px; opacity: 0.9">3 item</span><b style="font-size: 20px">42.000 ៛</b></span>
      <b style="font-size: 18px">Lihat pesanan ›</b>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (nama, harga, qty, habis) => ({ nama, harga, qty: qty || 0, inCart: !!qty, habis: !!habis, op: habis ? 0.6 : 1, bg: habis ? '#F2F4F7' : '#FFFFFF', border: qty ? '2px solid #047857' : '1px solid #EAECF0' });
    return {
      menu: [
        m('Ayam Goreng', '10.000 ៛', 2),
        m('Ayam Bakar', '12.000 ៛'),
        m('Pempek Kapal Selam', '14.000 ៛', 1),
        m('Pempek Lenjer', '10.000 ៛', 0, true),
        m('Kopi Susu', '6.000 ៛'),
        m('Es Teh Manis', '4.000 ៛', 2),
        m('Nasi Putih', '2.000 ៛'),
        m('Kerupuk', '2.000 ៛')
      ]
    };
  }
}
</script>
</body>
</html>
