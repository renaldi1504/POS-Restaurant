<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAF6; color: #191C1A; display: flex; flex-direction: column; font-size: 17px; line-height: 24px; overflow: hidden">

        <button role="radio" aria-checked="true" style="height: 56px; border-radius: 8px; border: none; background: #CFE9DA; color: #092017; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">check</span>Bahan baku</button>
        <button role="radio" style="height: 56px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">propane_tank</span>Gas</button>
        <button role="radio" style="height: 56px; border-radius: 8px; border: 1px solid #707973; background: transparent; color: #404944; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">local_gas_station</span>Bensin driver</button>

    <section style="display: flex; flex-direction: column; gap: 10px">

      <div style="position: relative">
        <label for="jml" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #F8FAF6; font-size: 14px; line-height: 18px; font-weight: 500; color: #006C4E">Jumlah</label>
        <input id="jml" class="num" value="35.000" inputmode="numeric" style="width: 100%; height: 64px; border-radius: 4px; border: 2px solid #006C4E; background: transparent; padding: 0 56px 0 16px; font-size: 30px; font-weight: 400; color: #191C1A; text-align: right; box-sizing: border-box; outline: none">
        <span style="position: absolute; right: 16px; top: 18px; font-size: 20px; color: #404944">៛</span>
      </div>
      <div role="radiogroup" aria-label="Mata uang" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 48px; border: 1px solid #707973; border-radius: 24px; overflow: hidden">
        <button role="radio" aria-checked="true" style="border: none; background: #CFE9DA; color: #092017; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span>Riel ៛</button>

        <button role="radio" style="border: none; border-left: 1px solid #707973; background: transparent; color: #191C1A; font-size: 16px; font-weight: 500">Rupiah</button>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 500">3. Uangnya dari mana?</h2>
      <div role="radiogroup" aria-label="Sumber uang" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 56px; border: 1px solid #707973; border-radius: 28px; overflow: hidden">
        <button role="radio" aria-checked="true" style="border: none; background: #CFE9DA; color: #092017; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">check</span>Cash laci</button>
        <button role="radio" style="border: none; border-left: 1px solid #707973; background: transparent; color: #191C1A; font-size: 16px; font-weight: 500">Transfer ABA</button>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="position: relative; margin-top: 6px">
        <label for="cat" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #F8FAF6; font-size: 14px; line-height: 18px; font-weight: 500; color: #404944">Catatan (boleh kosong)</label>
        <input id="cat" value="Beli ikan di pasar" style="width: 100%; height: 56px; border-radius: 4px; border: 1px solid #707973; background: transparent; padding: 0 16px; font-size: 17px; color: #191C1A; box-sizing: border-box">
      </div>
      <button style="height: 48px; border-radius: 24px; border: none; background: #CFE9DA; color: #092017; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" aria-hidden="true">photo_camera</span>Foto nota (opsional)</button>
    </section>
  </main>

  <footer style="flex-shrink: 0; background: #ECEEEB; padding: 12px 16px 16px">
    <button style="width: 100%; height: 64px; border-radius: 32px; border: none; background: #006C4E; color: #FFFFFF; font-size: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" aria-hidden="true">save</span>Simpan pengeluaran</button>
  </footer>
</div>
